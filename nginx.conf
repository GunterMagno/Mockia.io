server {
    listen 80;
    server_name localhost;

    # SEGURIDAD: NO anadir aqui ningun location ni upstream hacia el servicio `llm` (Ollama/vLLM, docker-compose.ai.yml): la API del modelo no tiene autenticacion y solo debe ser alcanzable desde el backend por la red interna de Docker. Lo comprueba deploy.aiCompose.test.ts.

    # Frontend estático
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy para la API del Backend. SPA y API comparten origen: asi la cookie HttpOnly del refresh token
    # (SameSite=Lax, Path=/api/auth) llega al backend. Nginx deja pasar Set-Cookie tal cual; no usar proxy_hide_header.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # IA: la cadena de proveedores puede tardar mucho mas que una peticion normal (modelo local en frio hasta
    # AI_LOCAL_TIMEOUT_MS, 120 s, mas la reserva en OpenRouter). El backend corta todo a AI_TOTAL_TIMEOUT_MS (240 s por
    # defecto), que debe quedar POR DEBAJO de proxy_read_timeout: si nginx cierra antes, el cliente ve un 504 mientras el
    # backend sigue trabajando (y generate-and-save puede guardar endpoints para un cliente que ya no esta).
    location /api/ai/ {
        proxy_pass http://backend:3000/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Reverse proxy para las rutas generadas del Mock Router
    location /mock/ {
        proxy_pass http://backend:3000/mock/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
