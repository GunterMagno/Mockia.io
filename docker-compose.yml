version: '3.9'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: mockia-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - mockia-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.dev
    container_name: mockia-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_PORT: 3000
      BACKEND_HOST: 0.0.0.0
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-password}@mongo:27017/mockia?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key}
      OPENROUTER_KEY: ${OPENROUTER_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./packages/backend/src:/app/src
      - ./packages/backend/package.json:/app/package.json
    networks:
      - mockia-network
    command: npm run dev

  # Frontend Development Server
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile.dev
    container_name: mockia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}/api
    volumes:
      - ./packages/frontend/src:/app/src
      - ./packages/frontend/package.json:/app/package.json
      - ./packages/frontend/vite.config.ts:/app/vite.config.ts
    networks:
      - mockia-network
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local

networks:
  mockia-network:
    driver: bridge
