services:
  # Backend Web Service
  - type: web
    name: mockia-backend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: packages/backend/Dockerfile.prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # User will need to provide this (e.g. from MongoDB Atlas); never the default ":password@"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BACKEND_PORT
        value: 3000
      # Proxy hops in front of Express, used to read the client IP from X-Forwarded-For (rate limits are per IP).
      # Browsers reach the API through the frontend's /api/* rewrite, so a request crosses that rewrite proxy AND
      # Render's load balancer: 2 hops. Too low = every user shares the proxy's IP (20 logins / 15 min for the whole
      # site); too high = a client can spoof its IP with its own X-Forwarded-For. MANDATORY post-deploy check in
      # docs/08_despliegue.md (8.2, "Comprobacion tras el despliegue").
      - key: TRUST_PROXY
        value: 2
      # Explicit frontend origin (never "*": the backend refuses to boot in production with an open CORS).
      # Adjust if you attach a custom domain to the frontend service.
      - key: CORS_ORIGIN
        value: https://mockia-frontend.onrender.com
      # Public URL of the application (the frontend origin: browsers reach the API through it, see routes below).
      - key: APP_URL
        value: https://mockia-frontend.onrender.com
      - key: OPENROUTER_API_KEY
        sync: false
      # AI settings (all optional: empty keeps the backend default). Set OPENROUTER_MODEL explicitly: the built-in default
      # may be retired by OpenRouter (the backend warns at startup) and the eval baseline must use this same model.
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_JSON_SCHEMA
        sync: false
      - key: AI_RATE_PER_MINUTE
        sync: false
      - key: AI_GENERATION_RETENTION_DAYS
        sync: false
      - key: AI_SPEC_TEMPERATURE
        sync: false
      # Transactional email (verification and password reset links). Without SMTP_URL nobody receives them and
      # unverified users cannot use AI generation or billing. Resend or Brevo (free plan); see docs/08_despliegue.md.
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Cobros con Stripe (docs/pagos.md): clave secreta, secreto del webhook y los cuatro price_... (Pro y Team, mensual y anual).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_TEAM
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: STRIPE_PRICE_TEAM_YEARLY
        sync: false

  # Frontend Static Site
  - type: web
    name: mockia-frontend
    runtime: static
    buildCommand: npm install && npm run build:frontend
    staticPublishPath: packages/frontend/dist
    envVars:
      # Same-origin API: the browser calls /api on the frontend host and Render proxies it to the backend
      # (routes below). Cookies/CORS then never cross sites (front and back are different sites on onrender.com).
      - key: VITE_API_URL
        value: /api
      # Datos del titular que publican el Aviso Legal y la Politica de Privacidad (LSSI art. 10, RGPD art. 13).
      # OBLIGATORIAS: el build de produccion FALLA si NAME, NIF, ADDRESS o EMAIL estan vacias. No pongas
      # VITE_LEGAL_ALLOW_PLACEHOLDER aqui: solo existe para CI. REGISTRY (datos registrales) es opcional.
      - key: VITE_LEGAL_NAME
        sync: false
      - key: VITE_LEGAL_NIF
        sync: false
      - key: VITE_LEGAL_ADDRESS
        sync: false
      - key: VITE_LEGAL_EMAIL
        sync: false
      - key: VITE_LEGAL_REGISTRY
        sync: false
    # Order matters: rules are evaluated top to bottom and the first match wins, so the API proxy must come
    # BEFORE the SPA fallback. Update the destination host if the backend service is renamed.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://mockia-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
