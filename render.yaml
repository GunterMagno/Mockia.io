services:
  # Backend Web Service
  - type: web
    name: mockia-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build:backend
    startCommand: npm start -w @mockia/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # User will need to provide this (e.g. from MongoDB Atlas)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BACKEND_PORT
        value: 3000
      - key: CORS_ORIGIN
        value: https://mockia-frontend.onrender.com # Adjust this after first deploy or use wildcards
      - key: OPENROUTER_API_KEY
        sync: false

  # Frontend Static Site
  - type: static
    name: mockia-frontend
    env: static
    buildCommand: npm install && npm run build:frontend
    staticPublishDir: packages/frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://mockia-backend.onrender.com/api # Replace with your backend URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
