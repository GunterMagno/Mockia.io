# Produccion. Todas las variables marcadas con `:?` son OBLIGATORIAS: si falta alguna, `docker compose` aborta
# (no hay valores por defecto para secretos ni contrasenas). Copia .env.example a .env y rellenalo.
# El backend ademas se niega a arrancar (assertProdConfig) con CORS "*", contrasena de Mongo por defecto,
# secretos JWT por defecto/cortos o sin APP_URL.
#
# IA propia (opcional): NO esta en este fichero. Se anade con ficheros de override, para que un despliegue sin IA propia
# no cambie ni un byte de su configuracion:
#   docker compose -f docker-compose.prod.yml -f docker-compose.ai.yml [-f docker-compose.ai.gpu.yml] up -d
#   (vLLM, solo GPU NVIDIA: -f docker-compose.ai.vllm.yml en lugar de docker-compose.ai.yml)
# El servicio `llm` no publica puertos y nginx no lo expone. Guia: docs/ia-local.md.
services:
  # MongoDB Database (solo accesible desde la red interna de compose: NO se publica ningun puerto al host)
  mongo:
    image: mongo:7.0
    container_name: mockia-mongo-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?falta MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?falta MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data_prod:/data/db
      - mongo_config_prod:/data/configdb
    networks:
      - mockia-network-prod
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.prod
    container_name: mockia-backend-prod
    restart: unless-stopped
    expose:
      - '3000' # Expose only internally, Nginx will proxy it
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3000
      BACKEND_HOST: 0.0.0.0
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:?falta MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD:?falta MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/mockia?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?falta JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Ajustes de IA: vacios = los valores por defecto del backend (una cadena vacia nunca los pisa).
      # OPENROUTER_MODEL: ponlo SIEMPRE en produccion (el modelo por defecto puede estar retirado; el backend avisa al arrancar).
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JSON_SCHEMA: ${OPENROUTER_JSON_SCHEMA:-}
      AI_RATE_PER_MINUTE: ${AI_RATE_PER_MINUTE:-}
      AI_GENERATION_RETENTION_DAYS: ${AI_GENERATION_RETENTION_DAYS:-}
      AI_SPEC_TEMPERATURE: ${AI_SPEC_TEMPERATURE:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?falta CORS_ORIGIN (origen publico del frontend, p. ej. https://app.midominio.com)}
      APP_URL: ${APP_URL:?falta APP_URL (URL publica de la aplicacion)}
      # Demo publica sin registro (docs/demo.md). VIENE APAGADA: DEMO_ENABLED=false salvo que lo pongas a true en .env.
      # Para encenderla hace falta ademas DEMO_HMAC_SECRET (>= 32 caracteres aleatorios, `openssl rand -hex 32`): con la demo
      # encendida y sin secreto el backend se niega a arrancar. Vacio = el valor por defecto del backend. Apagado de
      # emergencia: DEMO_ENABLED=false en .env y `docker compose -f docker-compose.prod.yml up -d backend`.
      # La IP del visitante (cupos de la demo, limitadores) sale de TRUST_PROXY = saltos de proxy delante del backend. 1 = solo el nginx
      # de este compose. Si pones delante un proxy TLS (docs/08_despliegue.md, 8.4) son 2: TRUST_PROXY=2 en el .env y el proxy debe
      # enviar X-Forwarded-For. Con un numero equivocado todos los visitantes comparten una IP o se puede falsificar.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_HMAC_SECRET: ${DEMO_HMAC_SECRET:-}
      DEMO_DAILY_GENERATIONS: ${DEMO_DAILY_GENERATIONS:-}
      DEMO_PER_IP_GENERATIONS: ${DEMO_PER_IP_GENERATIONS:-}
      DEMO_PER_NET_GENERATIONS: ${DEMO_PER_NET_GENERATIONS:-}
      DEMO_MAX_CONCURRENT: ${DEMO_MAX_CONCURRENT:-}
      DEMO_POW_BITS: ${DEMO_POW_BITS:-}
      DEMO_MOCK_TTL_MINUTES: ${DEMO_MOCK_TTL_MINUTES:-}
      AI_DEMO_PROVIDERS: ${AI_DEMO_PROVIDERS:-}
      AI_DEMO_TIMEOUT_MS: ${AI_DEMO_TIMEOUT_MS:-}
      # Correo transaccional (verificacion de email y recuperar contrasena). Sin SMTP_URL no se envia nada.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Vacio = el correo verificado (IA y facturacion) solo se exige en produccion, que es este caso
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-}
      # Cobros con Stripe (ver docs/pagos.md). Vacias = sin checkout (501) y webhook desactivado.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER_MONTHLY: ${STRIPE_PRICE_STARTER_MONTHLY:-}
      STRIPE_PRICE_STARTER_YEARLY: ${STRIPE_PRICE_STARTER_YEARLY:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
      STRIPE_PRICE_TEAM_YEARLY: ${STRIPE_PRICE_TEAM_YEARLY:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mockia-network-prod
    healthcheck:
      # 127.0.0.1 (no localhost): en Alpine localhost puede resolver a ::1 y el backend escucha en IPv4.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Frontend Static Server + Reverse Proxy (Nginx)
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile.prod
      # Titular del servicio: el build FALLA si NAME, NIF, ADDRESS o EMAIL estan vacios (ver .env.example)
      args:
        VITE_LEGAL_NAME: ${VITE_LEGAL_NAME:-}
        VITE_LEGAL_NIF: ${VITE_LEGAL_NIF:-}
        VITE_LEGAL_ADDRESS: ${VITE_LEGAL_ADDRESS:-}
        VITE_LEGAL_EMAIL: ${VITE_LEGAL_EMAIL:-}
        VITE_LEGAL_REGISTRY: ${VITE_LEGAL_REGISTRY:-}
    container_name: mockia-frontend-prod
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mockia-network-prod

volumes:
  mongo_data_prod:
    driver: local
  mongo_config_prod:
    driver: local

networks:
  mockia-network-prod:
    driver: bridge
