# Produccion. Todas las variables marcadas con `:?` son OBLIGATORIAS: si falta alguna, `docker compose` aborta
# (no hay valores por defecto para secretos ni contrasenas). Copia .env.example a .env y rellenalo.
# El backend ademas se niega a arrancar (assertProdConfig) con CORS "*", contrasena de Mongo por defecto,
# secretos JWT por defecto/cortos o sin APP_URL.
services:
  # MongoDB Database (solo accesible desde la red interna de compose: NO se publica ningun puerto al host)
  mongo:
    image: mongo:7.0
    container_name: mockia-mongo-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?falta MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?falta MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data_prod:/data/db
      - mongo_config_prod:/data/configdb
    networks:
      - mockia-network-prod
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.prod
    container_name: mockia-backend-prod
    restart: unless-stopped
    expose:
      - '3000' # Expose only internally, Nginx will proxy it
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3000
      BACKEND_HOST: 0.0.0.0
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:?falta MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD:?falta MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/mockia?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?falta JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?falta CORS_ORIGIN (origen publico del frontend, p. ej. https://app.midominio.com)}
      APP_URL: ${APP_URL:?falta APP_URL (URL publica de la aplicacion)}
      # Correo transaccional (verificacion de email y recuperar contrasena). Sin SMTP_URL no se envia nada.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Vacio = el correo verificado (IA y facturacion) solo se exige en produccion, que es este caso
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mockia-network-prod
    healthcheck:
      # 127.0.0.1 (no localhost): en Alpine localhost puede resolver a ::1 y el backend escucha en IPv4.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Frontend Static Server + Reverse Proxy (Nginx)
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile.prod
    container_name: mockia-frontend-prod
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mockia-network-prod

volumes:
  mongo_data_prod:
    driver: local
  mongo_config_prod:
    driver: local

networks:
  mockia-network-prod:
    driver: bridge
