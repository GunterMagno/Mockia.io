name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TODO(H10): estos tres pasos siguen en continue-on-error SOLO por la deuda previa del repo (medida al hacer
      # la Tarea 1): Prettier 244 ficheros sin formatear; ESLint backend 1210 errores (1162 de prettier/prettier) y
      # ESLint frontend 2050 errores (1971 de prettier/prettier). Hacer un barrido unico (`npm run format` +
      # `npm run lint:fix`, corrigiendo a mano los ~130 errores no autofixables) en un commit aparte y entonces
      # quitar continue-on-error de los tres pasos para que bloqueen.
      - name: Run Prettier format check
        run: npm run format:check
        continue-on-error: true

      - name: Run ESLint - Backend
        working-directory: ./packages/backend
        run: npm run lint
        continue-on-error: true

      - name: Run ESLint - Frontend
        working-directory: ./packages/frontend
        run: npm run lint
        continue-on-error: true

  build:
    name: Build (shared + backend + frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build
        env:
          # El build de produccion exige los datos legales del titular (VITE_LEGAL_*); CI solo comprueba que compila
          # y por eso usa marcadores visibles. Un despliegue real define VITE_LEGAL_NAME/NIF/ADDRESS/EMAIL.
          VITE_LEGAL_ALLOW_PLACEHOLDER: '1'

  compose-prod-config:
    name: Validate docker-compose.prod.yml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fails without required variables (no insecure defaults)
        run: |
          : > "$RUNNER_TEMP/empty.env"
          if docker compose --env-file "$RUNNER_TEMP/empty.env" -f docker-compose.prod.yml config -q; then
            echo "docker-compose.prod.yml must require its secrets, but it rendered without them"
            exit 1
          fi

      - name: Valid when every variable of .env.example is provided
        run: docker compose --env-file .env.example -f docker-compose.prod.yml config -q

      - name: MongoDB is not published to the host
        run: |
          docker compose --env-file .env.example -f docker-compose.prod.yml config --format json |
            node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s).services.mongo.ports||[];if(p.length){console.error('mongo must not publish ports',p);process.exit(1)}})"

  compose-ai-config:
    name: Validate AI compose overrides
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ollama on top of production
        run: docker compose --env-file .env.example -f docker-compose.prod.yml -f docker-compose.ai.yml config -q

      - name: Ollama with NVIDIA GPU on top of production
        run: docker compose --env-file .env.example -f docker-compose.prod.yml -f docker-compose.ai.yml -f docker-compose.ai.gpu.yml config -q

      - name: vLLM on top of production
        run: docker compose --env-file .env.example -f docker-compose.prod.yml -f docker-compose.ai.vllm.yml config -q

      - name: Ollama on top of the development compose
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.ai.yml config -q

      - name: The model API is never published and the production secrets stay mandatory
        run: |
          for combo in "-f docker-compose.prod.yml -f docker-compose.ai.yml" "-f docker-compose.prod.yml -f docker-compose.ai.vllm.yml"; do
            docker compose --env-file .env.example $combo config --format json |
              node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const p=j.services.llm.ports||[];if(p.length){console.error('llm must not publish ports',p);process.exit(1)}if(j.services.mongo.ports&&j.services.mongo.ports.length){console.error('mongo must not publish ports');process.exit(1)}})"
          done
          # Los secretos obligatorios de produccion siguen siendo obligatorios con el override.
          : > "$RUNNER_TEMP/empty.env"
          if docker compose --env-file "$RUNNER_TEMP/empty.env" -f docker-compose.prod.yml -f docker-compose.ai.yml config -q; then
            echo "the AI override must not remove the mandatory production variables"
            exit 1
          fi

      - name: Shell syntax of scripts/pull-model.sh
        run: sh -n scripts/pull-model.sh

  test-backend:
    name: Test - Backend
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          MONGODB_URI: mongodb://localhost:27017/mockia-test
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-secret-key-super-secure-for-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing
          SUPPRESS_LOGS: true

  type-check-backend:
    name: Type Check - Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Build backend
        working-directory: ./packages/backend
        run: npm run build

  type-check-frontend:
    name: Type Check - Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Build frontend
        working-directory: ./packages/frontend
        run: npm run build
        env:
          # El build de produccion exige los datos legales del titular (VITE_LEGAL_*); CI solo comprueba que compila
          # y por eso usa marcadores visibles. Un despliegue real define VITE_LEGAL_NAME/NIF/ADDRESS/EMAIL.
          VITE_LEGAL_ALLOW_PLACEHOLDER: '1'

  test-e2e:
    name: Test - E2E (Cypress)
    runs-on: ubuntu-latest
    needs: [test-backend]
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: ./packages/frontend
          start: |
            npm run dev -w @mockia/backend
            npm run dev -w @mockia/frontend
          wait-on: 'http://localhost:3000/api/health, http://localhost:5173'
          wait-on-timeout: 120
        env:
          MONGODB_URI: mongodb://localhost:27017/mockia-test
          NODE_ENV: development
          E2E: 'true'
          # The suite logs in more than the 20-per-15-min brute-force limit of /auth/login and /auth/register
          AUTH_RATE_LIMIT_MAX: 500
          # No SMTP in CI: emails are kept in memory and read by cypress/e2e/passwordReset.cy.ts at /api/__test__/outbox
          E2E_EXPOSE_MAIL_OUTBOX: 'true'
          # Los textos legales muestran marcadores en lugar de los datos del titular (legal.cy.ts los comprueba)
          VITE_LEGAL_ALLOW_PLACEHOLDER: '1'
          BACKEND_URL: http://localhost:3000
          JWT_ACCESS_SECRET: test-secret-key-super-secure-for-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing
          SUPPRESS_LOGS: true
