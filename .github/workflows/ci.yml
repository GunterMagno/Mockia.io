name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Resolver issues de formateo y linting (prettier/ESLint)
      - name: Run Prettier format check
        run: npm run format:check
        continue-on-error: true

      - name: Run ESLint - Backend
        working-directory: ./packages/backend
        run: npm run lint
        continue-on-error: true

      - name: Run ESLint - Frontend
        working-directory: ./packages/frontend
        run: npm run lint
        continue-on-error: true

  test-backend:
    name: Test - Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Run tests with coverage
        working-directory: ./packages/backend
        run: npm run test:coverage

  type-check-backend:
    name: Type Check - Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Build backend
        working-directory: ./packages/backend
        run: npm run build

  type-check-frontend:
    name: Type Check - Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Build frontend
        working-directory: ./packages/frontend
        run: npm run build
