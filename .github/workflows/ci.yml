name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Resolver issues de formateo y linting (prettier/ESLint)
      - name: Run Prettier format check
        run: npm run format:check
        continue-on-error: true

      - name: Run ESLint - Backend
        working-directory: ./packages/backend
        run: npm run lint
        continue-on-error: true

      - name: Run ESLint - Frontend
        working-directory: ./packages/frontend
        run: npm run lint
        continue-on-error: true

  test-backend:
    name: Test - Backend
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          MONGODB_URI: mongodb://localhost:27017/mockia-test
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-secret-key-super-secure-for-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing
          SUPPRESS_LOGS: true

  type-check-backend:
    name: Type Check - Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Build backend
        working-directory: ./packages/backend
        run: npm run build

  type-check-frontend:
    name: Type Check - Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Build frontend
        working-directory: ./packages/frontend
        run: npm run build

  test-e2e:
    name: Test - E2E (Cypress)
    runs-on: ubuntu-latest
    needs: [test-backend]
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: ./packages/frontend
          start: |
            npm run dev -w @mockia/backend
            npm run dev -w @mockia/frontend
          wait-on: 'http://localhost:3000/api/health, http://localhost:5173'
          wait-on-timeout: 120
        env:
          MONGODB_URI: mongodb://localhost:27017/mockia-test
          NODE_ENV: development
          E2E: 'true'
          BACKEND_URL: http://localhost:3000
          JWT_ACCESS_SECRET: test-secret-key-super-secure-for-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing
          SUPPRESS_LOGS: true
