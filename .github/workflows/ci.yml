name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Resolver issues de formateo y linting (prettier/ESLint)
      - name: Run Prettier format check
        run: npm run format:check
        continue-on-error: true

      - name: Run ESLint - Backend
        working-directory: ./packages/backend
        run: npm run lint
        continue-on-error: true

      - name: Run ESLint - Frontend
        working-directory: ./packages/frontend
        run: npm run lint
        continue-on-error: true

  test-backend:
    name: Test - Backend
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Run tests with coverage
        working-directory: ./packages/backend
        run: npm run test:coverage -- --forceExit --detectOpenHandles
        env:
          MONGODB_URI: mongodb://localhost:27017/mockia-test
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-secret-key-super-secure-for-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing
          SUPPRESS_LOGS: true

  type-check-backend:
    name: Type Check - Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Build backend
        working-directory: ./packages/backend
        run: npm run build

  type-check-frontend:
    name: Type Check - Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Build frontend
        working-directory: ./packages/frontend
        run: npm run build

  test-e2e:
    name: Test - E2E (Cypress)
    runs-on: ubuntu-latest
    needs: [type-check-backend, type-check-frontend]
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @mockia/shared

      - name: Start Services and Run E2E Tests
        run: |
          npm run dev -w @mockia/backend > backend.log 2>&1 &
          npm run dev -w @mockia/frontend > frontend.log 2>&1 &
          
          echo "Waiting for backend and frontend services to be ready..."
          npx wait-on http://localhost:5173 http://localhost:3000/api/health --timeout 60000 || {
            echo "::error::Timeout waiting for backend/frontend. Dumping logs..."
            echo "=== BACKEND LOGS ==="
            cat backend.log
            echo "=== FRONTEND LOGS ==="
            cat frontend.log
            exit 1
          }
          echo "Services are ready! Running Cypress E2E tests..."
          npx cypress run --project ./packages/frontend || {
            echo "::error::Cypress E2E tests failed! Dumping logs..."
            echo "=== BACKEND LOGS ==="
            cat backend.log
            echo "=== FRONTEND LOGS ==="
            cat frontend.log
            exit 1
          }
        env:
          MONGODB_URI: mongodb://localhost:27017/mockia-e2e
          BACKEND_PORT: 3000
          PORT: 3000
          JWT_ACCESS_SECRET: test-secret-key-super-secure-for-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing
          NODE_ENV: development
          SUPPRESS_LOGS: false
          VITE_API_URL: http://localhost:3000/api

