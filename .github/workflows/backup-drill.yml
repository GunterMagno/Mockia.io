name: Backup drill

# Simulacro semanal de restauracion: demuestra que las copias cifradas se pueden recuperar.
# Usa una base sembrada y una pareja de claves age temporal; no toca produccion ni usa secretos.
on:
  schedule:
    - cron: '23 4 * * 1' # lunes 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-drill:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Install age and mongodb-database-tools
        run: bash scripts/ci/install-backup-tools.sh

      - name: Drill
        run: bash scripts/ci/backup-drill.sh
        env:
          DRILL_MONGO_URI: mongodb://localhost:27017
