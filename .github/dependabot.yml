# Actualizaciones automaticas de dependencias (una vez por semana, agrupadas para no abrir un PR por paquete).
# Las menores y de parche van en un solo PR por ecosistema; las mayores (con cambios incompatibles) siguen llegando
# como PR propio para revisarlas una a una. Los avisos de seguridad de GitHub (Dependabot security updates) abren su
# PR aparte, sin esperar al lunes, y no dependen de este fichero.
version: 2

updates:
  # Monorepo con npm workspaces: un unico package-lock.json en la raiz (no hay lockfile en packages/*). Dependabot
  # lee los workspaces desde la raiz y actualiza ese lockfile, asi que basta con '/'. Listar tambien '/packages/*'
  # abriria dos PR por el mismo paquete (uno por directorio) sobre el mismo fichero y se pisarian entre si.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
